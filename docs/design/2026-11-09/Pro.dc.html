<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>I 데스크톱 프로 툴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.i-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:6px;border:1px solid #2e3d56;background:#1a2537;color:#dfe7f3;font:500 12.5px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.i-btn.danger{background:transparent;border-color:#5d2b38;color:#f5a9b6}
.i-seg{display:flex;border:1px solid #2e3d56;border-radius:6px;overflow:hidden}
.i-seg button{height:28px;padding:0 11px;border:0;border-left:1px solid #2e3d56;background:#131c2a;color:#a9b6ca;font:500 12.5px 'Noto Sans KR',sans-serif}
.i-seg button:first-child{border-left:0}
.i-pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.i-ph{height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#131c2a;border-bottom:1px solid #22304a;font:700 12px 'Noto Sans KR',sans-serif;color:#c3cfdf;flex:none}
.i-input{height:28px;border-radius:6px;border:1px solid #2e3d56;background:#0d1420;color:#eef3fa;padding:0 8px;font:600 13px 'JetBrains Mono',monospace;box-sizing:border-box}
.i-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.i-sb{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid #22304a;height:100%}
.i-lab{font-size:11.5px;color:#8797af}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;background:#0f1622;font-family:'Noto Sans KR',sans-serif;color:#dfe7f3;display:flex;flex-direction:column">

  <div style="height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0b111b;border-bottom:1px solid #1f2b3e;flex:none">
    <div style="width:22px;height:22px;border-radius:6px;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#ffffff;font:700 11px 'Noto Sans KR',sans-serif">J</div>
    <span style="font:700 14px 'Noto Sans KR',sans-serif;color:#ffffff;margin-right:10px">지후니우스</span>
    <sc-for list="{{popups}}" as="p" hint-placeholder-count="4"><button class="i-btn" type="button" style="height:26px">{{p}}</button></sc-for>
    <div style="flex:1"></div>
    <button class="i-btn" type="button" style="height:26px;background:#3a2c08;border-color:#7a5b10;color:#ffd76a">인수인계 2</button>
    <button class="i-btn" type="button" style="height:26px;background:#3a2c08;border-color:#7a5b10;color:#ffd76a">오류 기록 2</button>
    <button class="i-btn" type="button" style="height:26px">업데이트</button>
  </div>

  <div style="height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #1f2b3e;flex:none">
    <div class="i-seg"><button type="button" style="background:#24406d;color:#ffffff;font-weight:700">NC 가져오기</button><button type="button">STL 찾기</button><button type="button">세척완료</button></div>
    <div style="width:1px;height:24px;background:#273449"></div>
    <span class="i-lab">모드</span>
    <div class="i-seg"><button type="button">파일만</button><button type="button">리스트만</button><button type="button" style="background:#24406d;color:#ffffff;font-weight:700">파일 + 리스트</button></div>
    <span class="i-lab">리스트</span>
    <div class="i-seg"><button type="button" class="i-mono" style="background:#24406d;color:#ffffff">O3999</button><button type="button" class="i-mono">O3998</button></div>
    <label class="i-lab" for="i-year">연도</label><input id="i-year" class="i-input" value="2026" style="width:58px">
    <label class="i-lab" for="i-date">날짜</label><input id="i-date" class="i-input" value="11.09" style="width:64px;border-color:#3b82f6">
    <button class="i-btn" type="button" style="height:28px">경로</button>
    <div style="flex:1"></div>
    <button type="button" style="height:32px;padding:0 16px;border-radius:6px;border:0;background:#3b82f6;color:#ffffff;font:700 13px 'Noto Sans KR',sans-serif;display:inline-flex;align-items:center;gap:6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>실행</button>
  </div>

  <div style="display:grid;grid-template-columns:190px 330px minmax(0,1fr);height:390px;border-bottom:1px solid #1f2b3e;flex:none">
    <div class="i-pane" style="border-right:1px solid #1f2b3e">
      <div class="i-ph">프로그램 번호<span class="i-lab" style="margin-left:auto">4</span></div>
      <div class="i-mono" style="flex:1;padding:10px 14px;font-size:15px;font-weight:700;line-height:1.75;color:#ffffff;white-space:pre-line;background:#0d1420">1452
1462
6001
6002</div>
    </div>
    <div class="i-pane" style="border-right:1px solid #1f2b3e">
      <div class="i-ph">드라이브 F:\<span style="color:#86e3a8;font-weight:500">● 연결됨</span><div style="flex:1"></div><button class="i-btn" type="button" style="height:22px;padding:0 8px;font-size:11.5px">추가</button><button class="i-btn" type="button" style="height:22px;padding:0 8px;font-size:11.5px">새로고침</button></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) 70px 60px;padding:6px 12px;font-size:11.5px;color:#8797af;border-bottom:1px solid #1a2639"><span>이름</span><span>크기</span><span>수정</span></div>
      <div style="flex:1;overflow:hidden">
        <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
          <div class="i-mono" style="display:grid;grid-template-columns:minmax(0,1fr) 70px 60px;padding:6px 12px;font-size:12px;border-bottom:1px solid #141e2e;background:{{f.bg}}"><span style="color:#eef3fa">{{f.name}}</span><span style="color:#8797af">{{f.size}}</span><span style="color:#8797af">{{f.time}}</span></div>
        </sc-for>
      </div>
      <div style="display:flex;gap:6px;padding:8px 12px;border-top:1px solid #1a2639"><button class="i-btn danger" type="button" style="flex:1">F: 드라이브 비우기</button><button class="i-btn danger" type="button">삭제</button></div>
    </div>
    <div class="i-pane">
      <div class="i-ph">작업 기록<span class="i-lab" style="margin-left:auto">최근 100줄</span></div>
      <div style="flex:1;padding:8px 14px;display:flex;flex-direction:column;gap:6px;overflow:hidden">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="6"><div class="i-mono" style="display:flex;gap:10px;font-size:12px;line-height:1.5"><span style="color:#5f6f88">{{l.t}}</span><span style="color:{{l.c}};font-family:'Noto Sans KR',sans-serif">{{l.m}}</span></div></sc-for>
      </div>
    </div>
  </div>

  <div class="i-pane" style="flex:1">
    <div class="i-ph">설비 · 소재 사용량<div style="flex:1"></div><span class="i-lab">알림</span><div role="img" aria-label="알림 켜짐" style="width:34px;height:18px;border-radius:999px;background:#3b82f6;position:relative"><span style="position:absolute;right:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#ffffff"></span></div><button class="i-btn" type="button" style="height:22px;padding:0 8px;font-size:11.5px">알림 설정</button></div>
    <div style="display:grid;grid-template-columns:90px repeat(9,minmax(0,1fr));font-size:12.5px">
      <div class="i-lab" style="padding:8px 12px;border-bottom:1px solid #1a2639">호기</div>
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9"><div style="padding:8px 0;text-align:center;border-bottom:1px solid #1a2639;border-left:1px solid #1a2639;font-weight:700">{{m.n}}</div></sc-for>
      <div class="i-lab" style="padding:0 12px;height:46px;display:flex;align-items:center;border-bottom:1px solid #1a2639">상태 · 번호</div>
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9"><div style="height:46px;border-bottom:1px solid #1a2639;border-left:1px solid #1a2639;padding:5px;box-sizing:border-box"><div style="height:100%;border-radius:6px;background:{{m.bg}};color:{{m.fg}};display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font:600 10.5px 'Noto Sans KR',sans-serif">{{m.state}}</span><span class="i-mono" style="font-size:13.5px;font-weight:700">{{m.prog}}</span></div></div></sc-for>
      <div class="i-lab" style="padding:0 12px;height:42px;display:flex;align-items:center;border-bottom:1px solid #1a2639">불량</div>
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9"><div style="height:42px;border-bottom:1px solid #1a2639;border-left:1px solid #1a2639;display:flex;align-items:center;justify-content:center"><button class="i-btn" type="button" aria-label="{{m.n}}호기 불량" style="height:28px;width:80%;padding:0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path></svg>불량</button></div></sc-for>
      <div class="i-lab" style="padding:0 12px;height:42px;display:flex;align-items:center">소재교체</div>
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9"><div style="height:42px;border-left:1px solid #1a2639;display:flex;align-items:center;justify-content:center"><button class="i-btn" type="button" aria-label="{{m.n}}호기 소재교체" style="height:28px;width:80%;padding:0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7fb0ff" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>교체</button></div></sc-for>
    </div>
  </div>

  <div style="height:28px;display:flex;align-items:center;background:#0b111b;border-top:1px solid #1f2b3e;font-size:12px;color:#a9b6ca;flex:none">
    <div style="display:flex;align-items:center;gap:6px;padding:0 12px;color:#86e3a8;height:100%"><span style="width:7px;height:7px;border-radius:50%;background:#34d399"></span>대기 중</div>
    <div class="i-sb">F:\ 연결됨 · 파일 5개</div>
    <div class="i-sb">NC게이트 연결 · 9대</div>
    <div class="i-sb">MES/POP 대기</div>
    <div style="flex:1"></div>
    <div class="i-sb i-mono">v2026.11.09.9</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#22c55e', '#052410'], ALARM: ['#ef4444', '#ffffff'], WAIT: ['#facc15', '#2a2200'], OFF: ['#263247', '#b8c3d4'] };
    const label = { RUN: '가공', ALARM: '알람', WAIT: '대기', OFF: '정지' };
    const raw = [[1,'RUN','6001'],[2,'RUN','6001'],[3,'RUN','1452'],[4,'RUN','6003'],[5,'ALARM','1462'],[6,'OFF','—'],[7,'WAIT','6002'],[8,'RUN','1452'],[9,'OFF','—']];
    const files = [['O1452','12 KB','09:12'],['O1462','11 KB','09:12'],['O3999','1 KB','09:12'],['O6001','14 KB','09:12'],['수정10.30.py','10 KB','11/05']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량'],
      files: files.map(([name, size, time], i) => ({ name, size, time, bg: i === 1 ? '#16284a' : 'transparent' })),
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#dfe7f3' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#dfe7f3' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#86e3a8' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#ffd76a' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#dfe7f3' }
      ],
      machines: raw.map(([n, s, p]) => ({ n: n, state: label[s], prog: p, bg: colors[s][0], fg: colors[s][1] }))
    };
  }
}
</script>
</body>
</html>
