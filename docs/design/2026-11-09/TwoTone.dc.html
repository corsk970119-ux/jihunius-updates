<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>E 투톤 콘솔</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.e-top{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 13px;border-radius:7px;border:1px solid #374151;background:#1f2937;color:#e5e7eb;font:500 13px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.e-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid #d1d5db;background:#ffffff;color:#1f2937;font:600 13px 'Noto Sans KR',sans-serif;box-sizing:border-box;box-shadow:0 1px 0 #e5e7eb}
.e-btn.primary{background:#4f46e5;border-color:#4338ca;color:#ffffff;box-shadow:0 1px 0 #3730a3}
.e-btn.danger{color:#b91c1c;border-color:#fca5a5;background:#fff7f7}
.e-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;box-sizing:border-box;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.e-label{font:600 12px 'Noto Sans KR',sans-serif;color:#475569}
.e-h{font:700 14px 'Noto Sans KR',sans-serif;color:#0f172a;margin:0}
.e-input{height:34px;border-radius:8px;border:1px solid #cbd5e1;background:#ffffff;color:#0f172a;padding:0 10px;font:600 14px 'JetBrains Mono',monospace;box-sizing:border-box}
.e-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;background:#eef2f7;font-family:'Noto Sans KR',sans-serif;color:#1f2937;display:flex;flex-direction:column">

  <div style="background:#111827;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px;height:36px">
      <div style="width:30px;height:30px;border-radius:8px;background:#6366f1;display:flex;align-items:center;justify-content:center;color:#ffffff;font:700 14px 'Noto Sans KR',sans-serif">J</div>
      <div style="font:700 19px 'Noto Sans KR',sans-serif;color:#ffffff">지후니우스</div>
      <div style="width:1px;height:18px;background:#374151;margin:0 4px"></div>
      <sc-for list="{{popups}}" as="p" hint-placeholder-count="4">
        <button class="e-top" type="button">{{p}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
      </sc-for>
      <div style="flex:1"></div>
      <button class="e-top" type="button" style="border-color:#a16207;background:#422006;color:#fde68a">오류 기록 2</button>
      <button class="e-top" type="button">업데이트</button>
    </div>
    <div style="display:flex;align-items:flex-end;gap:4px">
      <button type="button" style="height:38px;padding:0 18px;border:0;border-radius:9px 9px 0 0;background:#eef2f7;color:#0f172a;font:700 13px 'Noto Sans KR',sans-serif">지후니우스</button>
      <button type="button" style="height:38px;padding:0 18px;border:0;border-radius:9px 9px 0 0;background:transparent;color:#9ca3af;font:500 13px 'Noto Sans KR',sans-serif">STL 찾기</button>
      <button type="button" style="height:38px;padding:0 18px;border:0;border-radius:9px 9px 0 0;background:transparent;color:#9ca3af;font:500 13px 'Noto Sans KR',sans-serif">세척완료</button>
      <div style="flex:1;display:flex;justify-content:center;padding-bottom:6px"><button class="e-top" type="button" style="background:#facc15;border-color:#facc15;color:#1f1600;font-weight:700">인수인계 2건</button></div>
      <div style="padding-bottom:10px;display:flex;align-items:center;gap:6px;color:#86efac;font:600 12px 'Noto Sans KR',sans-serif"><span style="width:8px;height:8px;border-radius:50%;background:#22c55e"></span>대기 중</div>
    </div>
  </div>

  <div style="flex:1;padding:14px 20px 16px;display:flex;flex-direction:column;gap:12px">
    <div class="e-card" style="padding:14px 16px;display:flex;align-items:center;gap:16px">
      <div style="display:flex;padding:4px;gap:4px;background:#f1f5f9;border-radius:10px;flex:1">
        <button type="button" style="flex:1;height:34px;border:0;border-radius:7px;background:transparent;color:#475569;font:500 13px 'Noto Sans KR',sans-serif">파일만 가져오기</button>
        <button type="button" style="flex:1;height:34px;border:0;border-radius:7px;background:transparent;color:#475569;font:500 13px 'Noto Sans KR',sans-serif">리스트만 만들기</button>
        <button type="button" style="flex:1;height:34px;border:0;border-radius:7px;background:#ffffff;color:#4338ca;font:700 13px 'Noto Sans KR',sans-serif;box-shadow:0 1px 3px rgba(15,23,42,.15)">파일 + 리스트 만들기</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="e-label">리스트</span>
        <div style="display:flex;padding:3px;gap:3px;background:#f1f5f9;border-radius:8px"><button type="button" class="e-mono" style="height:28px;padding:0 10px;border:0;border-radius:6px;background:#4f46e5;color:#ffffff;font-size:12.5px">O3999</button><button type="button" class="e-mono" style="height:28px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:#475569;font-size:12.5px">O3998</button></div>
        <label class="e-label" for="e-year" style="margin-left:6px">연도</label><input id="e-year" class="e-input" value="2026" style="width:72px">
        <label class="e-label" for="e-date">날짜</label><input id="e-date" class="e-input" value="11.09" style="width:82px;border-color:#6366f1;box-shadow:0 0 0 3px #e0e7ff">
        <button class="e-btn" type="button">경로설정</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:262px 262px minmax(0,1fr);gap:12px;height:338px">
      <div class="e-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="e-h">드라이브 정리</h2><span style="font:600 12px 'Noto Sans KR',sans-serif;color:#15803d;background:#dcfce7;padding:2px 8px;border-radius:999px">F:\ 연결됨</span></div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="e-btn" type="button">추가</button><button class="e-btn" type="button">새로고침</button></div>
        <div style="flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:4px;overflow:hidden">
          <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
            <div class="e-mono" style="padding:6px 8px;border-radius:6px;font-size:12.5px;color:#1f2937">{{f}}</div>
          </sc-for>
        </div>
        <div style="display:flex;gap:8px"><button class="e-btn danger" type="button" style="flex:1">F: 드라이브 비우기</button><button class="e-btn danger" type="button">삭제</button></div>
      </div>

      <div class="e-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="e-h">프로그램 번호</h2><span style="font-size:12px;color:#64748b">4개</span></div>
        <div class="e-mono" style="flex:1;background:#f8fafc;border:1px solid #cbd5e1;border-radius:8px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.75;color:#0f172a;white-space:pre-line">1452
1462
6001
6002</div>
        <button class="e-btn primary" type="button" style="height:42px">파일 + 리스트 만들기</button>
      </div>

      <div class="e-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="e-h">작업 기록</h2><span style="font-size:12px;color:#64748b">최근 100줄</span></div>
        <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;border:1px solid #e2e8f0;border-radius:8px">
          <sc-for list="{{log}}" as="l" hint-placeholder-count="6">
            <div style="display:flex;gap:10px;font-size:12.5px;line-height:1.5;padding:7px 12px;border-bottom:1px solid #f1f5f9"><span class="e-mono" style="color:#64748b;flex:none">{{l.t}}</span><span style="color:{{l.c}}">{{l.m}}</span></div>
          </sc-for>
        </div>
      </div>
    </div>

    <div class="e-card" style="padding:12px 16px;display:flex;align-items:center;gap:20px">
      <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:640px">
        <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
          <div style="height:44px;border-radius:9px;background:{{m.bg}};color:{{m.fg}};display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box">
            <span style="font:700 12px 'Noto Sans KR',sans-serif">머신{{m.n}}</span><span class="e-mono" style="font-size:14px;font-weight:700">{{m.prog}}</span>
          </div>
        </sc-for>
      </div>
      <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px">
        <div style="display:flex;flex-direction:column;gap:2px;align-items:flex-end"><span style="font:700 13px 'Noto Sans KR',sans-serif;color:#0f172a">머신 알림</span><span style="font-size:12px;color:#64748b">9대 선택</span></div>
        <div role="img" aria-label="알림 켜짐" style="width:46px;height:24px;border-radius:999px;background:#4f46e5;position:relative"><span style="position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#ffffff"></span></div>
        <button class="e-btn" type="button">알림 설정</button>
      </div>
    </div>

    <div class="e-card" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;flex:1">
      <h2 class="e-h">소재 사용량 조사</h2>
      <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px">
        <sc-for list="{{units}}" as="u" hint-placeholder-count="9">
          <div style="border:1px solid #e2e8f0;border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:#f8fafc">
            <div style="text-align:center;font:700 12px 'Noto Sans KR',sans-serif;color:#334155">{{u}}</div>
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px">
              <button class="e-btn" type="button" aria-label="{{u}} 불량" style="height:44px;padding:0;flex-direction:column;gap:2px;font-size:11px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>불량</button>
              <button class="e-btn" type="button" aria-label="{{u}} 소재교체" style="height:44px;padding:0;flex-direction:column;gap:2px;font-size:11px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>교체</button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#16a34a', '#ffffff'], ALARM: ['#dc2626', '#ffffff'], WAIT: ['#facc15', '#3b2f00'], OFF: ['#e2e8f0', '#334155'] };
    const raw = [[1,'RUN','6001'],[3,'RUN','1452'],[5,'ALARM','1462'],[7,'WAIT','6002'],[9,'OFF','—'],[2,'RUN','6001'],[4,'RUN','6003'],[6,'OFF','—'],[8,'RUN','1452']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량 Beta'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#1f2937' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#1f2937' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#15803d' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#b45309' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#1f2937' }
      ],
      machines: raw.map(([n, s, p]) => ({ n: n, prog: p, bg: colors[s][0], fg: colors[s][1] })),
      units: ['1호기','2호기','3호기','4호기','5호기','6호기','7호기','8호기','9호기']
    };
  }
}
</script>
</body>
</html>
