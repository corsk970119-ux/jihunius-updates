<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>F 사이드 메뉴형</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.f-nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:#a9b6ca;font:500 13.5px 'Noto Sans KR',sans-serif;width:100%;box-sizing:border-box;text-align:left}
.f-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid #2e3d56;background:#1a2537;color:#dfe7f3;font:500 13px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.f-btn.primary{background:#3b82f6;border-color:#3b82f6;color:#ffffff;font-weight:700}
.f-btn.danger{background:transparent;border-color:#5d2b38;color:#f5a9b6}
.f-sec{font:600 11px 'Noto Sans KR',sans-serif;color:#6f7f98;letter-spacing:.06em;padding:0 12px}
.f-h{font:700 15px 'Noto Sans KR',sans-serif;color:#eef3fa;margin:0}
.f-input{height:34px;border-radius:8px;border:1px solid #2e3d56;background:#0d1420;color:#eef3fa;padding:0 10px;font:600 14px 'JetBrains Mono',monospace;box-sizing:border-box}
.f-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;display:flex;background:#0f1622;font-family:'Noto Sans KR',sans-serif;color:#dfe7f3">

  <nav aria-label="메뉴" style="width:208px;flex:none;background:#0b111b;border-right:1px solid #1f2b3e;padding:16px 10px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;align-items:center;gap:10px;padding:4px 10px 18px">
      <div style="width:30px;height:30px;border-radius:8px;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#ffffff;font:700 14px 'Noto Sans KR',sans-serif">J</div>
      <span style="font:700 18px 'Noto Sans KR',sans-serif;color:#ffffff">지후니우스</span>
    </div>
    <div class="f-sec">작업</div>
    <button class="f-nav" type="button" style="background:#1a2537;color:#ffffff;font-weight:700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7fb0ff" stroke-width="2" aria-hidden="true"><path d="M4 4h16v16H4z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg>NC 파일 가져오기</button>
    <button class="f-nav" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a9b6ca" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>STL 찾기</button>
    <button class="f-nav" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a9b6ca" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4 10-10"></path></svg>세척완료</button>
    <div class="f-sec" style="margin-top:14px">창 열기</div>
    <sc-for list="{{popups}}" as="p" hint-placeholder-count="4">
      <button class="f-nav" type="button">{{p}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6f7f98" stroke-width="2" aria-hidden="true" style="margin-left:auto"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
    </sc-for>
    <div style="flex:1"></div>
    <button class="f-nav" type="button" style="color:#ffd76a">인수인계<span style="margin-left:auto;background:#f5b942;color:#1a1300;border-radius:999px;padding:0 7px;font:700 11px 'Noto Sans KR',sans-serif;line-height:18px">2</span></button>
    <button class="f-nav" type="button" style="color:#ffd76a">오류 기록<span style="margin-left:auto;background:#3a2c08;color:#ffd76a;border-radius:999px;padding:0 7px;font:700 11px 'Noto Sans KR',sans-serif;line-height:18px">2</span></button>
    <button class="f-nav" type="button">업데이트</button>
    <div style="display:flex;align-items:center;gap:8px;padding:10px 12px 0;border-top:1px solid #1f2b3e;margin-top:6px;font:500 12px 'Noto Sans KR',sans-serif;color:#86e3a8"><span style="width:8px;height:8px;border-radius:50%;background:#34d399"></span>대기 중</div>
  </nav>

  <main style="flex:1;min-width:0;padding:20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;align-items:center;gap:16px">
      <div style="display:flex;flex-direction:column;gap:2px"><h1 style="margin:0;font:700 22px 'Noto Sans KR',sans-serif;color:#ffffff">NC 파일 가져오기</h1><span style="font-size:13px;color:#93a1b8">날짜 폴더에서 가져와 수정10.30을 적용하고 리스트를 만듭니다</span></div>
      <div style="flex:1"></div>
      <div style="display:flex;gap:3px;padding:3px;background:#0b111b;border:1px solid #1f2b3e;border-radius:10px">
        <button type="button" style="height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:#a9b6ca;font:500 13px 'Noto Sans KR',sans-serif">파일만</button>
        <button type="button" style="height:32px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:#a9b6ca;font:500 13px 'Noto Sans KR',sans-serif">리스트만</button>
        <button type="button" style="height:32px;padding:0 14px;border:0;border-radius:7px;background:#3b82f6;color:#ffffff;font:700 13px 'Noto Sans KR',sans-serif">파일 + 리스트</button>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;height:390px">
      <div style="display:flex;flex-direction:column;gap:12px;background:#172131;border:1px solid #273449;border-radius:12px;padding:16px">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
          <div style="display:flex;flex-direction:column;gap:5px"><label for="f-year" style="font-size:12px;color:#93a1b8">연도</label><input id="f-year" class="f-input" value="2026"></div>
          <div style="display:flex;flex-direction:column;gap:5px"><label for="f-date" style="font-size:12px;color:#93a1b8">날짜 폴더</label><input id="f-date" class="f-input" value="11.09" style="border-color:#3b82f6"></div>
        </div>
        <div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#93a1b8">리스트</span><button type="button" class="f-btn f-mono" style="height:28px;padding:0 10px;background:#24406d;border-color:#3b82f6">O3999</button><button type="button" class="f-btn f-mono" style="height:28px;padding:0 10px">O3998</button><button type="button" class="f-btn" style="height:28px;padding:0 10px;margin-left:auto">경로설정</button></div>
        <div style="font-size:12px;color:#93a1b8">프로그램 번호</div>
        <div class="f-mono" style="flex:1;background:#0d1420;border:1px solid #273449;border-radius:8px;padding:10px 12px;font-size:15px;font-weight:700;line-height:1.7;color:#ffffff;white-space:pre-line">1452
1462
6001
6002</div>
        <button class="f-btn primary" type="button" style="height:42px">파일 + 리스트 만들기</button>
      </div>

      <div style="display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:16px">
        <div style="background:#172131;border:1px solid #273449;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-height:0">
          <div style="display:flex;align-items:center;gap:8px"><h2 class="f-h">드라이브 F:\</h2><span style="font-size:12px;color:#86e3a8">연결됨 · 파일 5개</span><div style="flex:1"></div><button class="f-btn" type="button" style="height:30px">추가</button><button class="f-btn" type="button" style="height:30px">새로고침</button><button class="f-btn danger" type="button" style="height:30px">삭제</button><button class="f-btn danger" type="button" style="height:30px">드라이브 비우기</button></div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{files}}" as="f" hint-placeholder-count="5"><span class="f-mono" style="padding:6px 10px;border-radius:7px;background:#0d1420;border:1px solid #273449;font-size:12.5px">{{f}}</span></sc-for>
          </div>
        </div>
        <div style="background:#172131;border:1px solid #273449;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden">
          <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="f-h">작업 기록</h2><span style="font-size:12px;color:#93a1b8">최근 100줄</span></div>
          <sc-for list="{{log}}" as="l" hint-placeholder-count="4"><div style="display:flex;gap:10px;font-size:12.5px"><span class="f-mono" style="color:#6f7f98">{{l.t}}</span><span style="color:{{l.c}}">{{l.m}}</span></div></sc-for>
        </div>
      </div>
    </div>

    <div style="background:#172131;border:1px solid #273449;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:1">
      <div style="display:flex;align-items:center;gap:12px"><h2 class="f-h">설비 · 소재</h2><span style="font-size:12px;color:#93a1b8">알림 9대</span><div style="flex:1"></div><div role="img" aria-label="알림 켜짐" style="width:44px;height:24px;border-radius:999px;background:#3b82f6;position:relative"><span style="position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#ffffff"></span></div><button class="f-btn" type="button" style="height:30px">알림 설정</button></div>
      <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px">
        <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
          <div style="display:flex;flex-direction:column;gap:6px">
            <div style="height:48px;border-radius:9px;background:{{m.bg}};color:{{m.fg}};display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font:600 11px 'Noto Sans KR',sans-serif">{{m.n}}호기</span><span class="f-mono" style="font-size:15px;font-weight:700">{{m.prog}}</span></div>
            <button class="f-btn" type="button" style="height:30px;padding:0;font-size:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path></svg>불량</button>
            <button class="f-btn" type="button" style="height:30px;padding:0;font-size:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7fb0ff" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>교체</button>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#22c55e', '#052410'], ALARM: ['#ef4444', '#ffffff'], WAIT: ['#facc15', '#2a2200'], OFF: ['#263247', '#b8c3d4'] };
    const raw = [[1,'RUN','6001'],[2,'RUN','6001'],[3,'RUN','1452'],[4,'RUN','6003'],[5,'ALARM','1462'],[6,'OFF','—'],[7,'WAIT','6002'],[8,'RUN','1452'],[9,'OFF','—']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#dfe7f3' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#86e3a8' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#ffd76a' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#dfe7f3' }
      ],
      machines: raw.map(([n, s, p]) => ({ n: n, prog: p, bg: colors[s][0], fg: colors[s][1] }))
    };
  }
}
</script>
</body>
</html>
