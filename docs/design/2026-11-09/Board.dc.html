<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>G 설비 보드 중심</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid #2e3d56;background:#1a2537;color:#dfe7f3;font:500 13px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.g-btn.primary{background:#3b82f6;border-color:#3b82f6;color:#ffffff;font-weight:700}
.g-btn.danger{background:transparent;border-color:#5d2b38;color:#f5a9b6}
.g-panel{background:#172131;border:1px solid #273449;border-radius:12px;box-sizing:border-box}
.g-h{font:700 14px 'Noto Sans KR',sans-serif;color:#eef3fa;margin:0}
.g-input{height:32px;border-radius:8px;border:1px solid #2e3d56;background:#0d1420;color:#eef3fa;padding:0 10px;font:600 13.5px 'JetBrains Mono',monospace;box-sizing:border-box}
.g-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;padding:14px 18px;background:#0f1622;font-family:'Noto Sans KR',sans-serif;color:#dfe7f3;display:flex;flex-direction:column;gap:12px">

  <div style="display:flex;align-items:center;gap:10px;height:40px">
    <span style="font:700 19px 'Noto Sans KR',sans-serif;color:#ffffff;margin-right:8px">지후니우스</span>
    <div style="display:flex;gap:3px;padding:3px;background:#0b111b;border:1px solid #1f2b3e;border-radius:9px">
      <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:#24406d;color:#ffffff;font:700 12.5px 'Noto Sans KR',sans-serif">NC 가져오기</button>
      <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#a9b6ca;font:500 12.5px 'Noto Sans KR',sans-serif">STL 찾기</button>
      <button type="button" style="height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#a9b6ca;font:500 12.5px 'Noto Sans KR',sans-serif">세척완료</button>
    </div>
    <div style="flex:1"></div>
    <sc-for list="{{popups}}" as="p" hint-placeholder-count="4"><button class="g-btn" type="button" style="height:30px">{{p}}</button></sc-for>
    <div style="width:1px;height:20px;background:#273449"></div>
    <button class="g-btn" type="button" style="height:30px;background:#3a2c08;border-color:#7a5b10;color:#ffd76a">인수인계 2</button>
    <button class="g-btn" type="button" style="height:30px;background:#3a2c08;border-color:#7a5b10;color:#ffd76a">오류 2</button>
    <button class="g-btn" type="button" style="height:30px">업데이트</button>
  </div>

  <div style="display:flex;align-items:center;gap:10px">
    <h2 class="g-h" style="font-size:16px">설비 현황</h2>
    <span style="font-size:12px;color:#93a1b8">가공 5 · 알람 1 · 대기 1 · 정지 2</span>
    <div style="flex:1"></div>
    <span style="font-size:12px;color:#93a1b8">알림</span>
    <div role="img" aria-label="알림 켜짐" style="width:40px;height:22px;border-radius:999px;background:#3b82f6;position:relative"><span style="position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#ffffff"></span></div>
    <button class="g-btn" type="button" style="height:28px">알림 설정</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px">
    <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
      <div style="border-radius:12px;overflow:hidden;border:1px solid #273449;background:#172131;display:flex;flex-direction:column">
        <div style="background:{{m.bg}};color:{{m.fg}};padding:8px 12px;display:flex;flex-direction:column;gap:2px">
          <div style="display:flex;justify-content:space-between;font:700 12px 'Noto Sans KR',sans-serif"><span>머신 {{m.n}}</span><span>{{m.state}}</span></div>
          <span class="g-mono" style="font-size:24px;font-weight:800;letter-spacing:.02em">{{m.prog}}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px">
          <button class="g-btn" type="button" style="padding:0;font-size:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffd76a" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path></svg>불량</button>
          <button class="g-btn" type="button" style="padding:0;font-size:12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7fb0ff" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>소재교체</button>
        </div>
      </div>
    </sc-for>
    <div style="border-radius:12px;border:1px dashed #2e3d56;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:12px;color:#93a1b8;font-size:12px">
      <span style="font:700 13px 'Noto Sans KR',sans-serif;color:#dfe7f3">소재 사용량 조사</span>
      <span>각 호기 카드에서 바로 입력</span>
      <span style="color:#7fb0ff">기간 통계 열기 →</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:360px 250px minmax(0,1fr);gap:12px;flex:1;min-height:0">
    <div class="g-panel" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="g-h">NC 파일 가져오기</h2><span style="font:600 12px 'Noto Sans KR',sans-serif;color:#86e3a8">● 대기 중</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;background:#0d1420;border:1px solid #273449;border-radius:9px">
        <button type="button" style="height:28px;border:0;border-radius:6px;background:transparent;color:#a9b6ca;font:500 12px 'Noto Sans KR',sans-serif">파일만</button>
        <button type="button" style="height:28px;border:0;border-radius:6px;background:transparent;color:#a9b6ca;font:500 12px 'Noto Sans KR',sans-serif">리스트만</button>
        <button type="button" style="height:28px;border:0;border-radius:6px;background:#3b82f6;color:#ffffff;font:700 12px 'Noto Sans KR',sans-serif">파일 + 리스트</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center"><button type="button" class="g-btn g-mono" style="padding:0 9px;background:#24406d;border-color:#3b82f6">O3999</button><button type="button" class="g-btn g-mono" style="padding:0 9px">O3998</button><input class="g-input" aria-label="연도" value="2026" style="width:64px"><input class="g-input" aria-label="날짜 폴더" value="11.09" style="width:70px;border-color:#3b82f6"><button class="g-btn" type="button" aria-label="경로설정" style="padding:0 9px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a9b6ca" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></button></div>
      <div class="g-mono" style="flex:1;background:#0d1420;border:1px solid #273449;border-radius:8px;padding:8px 12px;font-size:14px;font-weight:700;line-height:1.65;color:#ffffff;white-space:pre-line">1452
1462
6001
6002</div>
      <button class="g-btn primary" type="button" style="height:40px">파일 + 리스트 만들기</button>
    </div>
    <div class="g-panel" style="padding:14px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="g-h">드라이브</h2><span class="g-mono" style="font-size:12px;color:#86e3a8">F:\</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px"><button class="g-btn" type="button">추가</button><button class="g-btn" type="button">새로고침</button></div>
      <div style="flex:1;background:#0d1420;border:1px solid #273449;border-radius:8px;padding:4px;overflow:hidden">
        <sc-for list="{{files}}" as="f" hint-placeholder-count="5"><div class="g-mono" style="padding:5px 8px;font-size:12px">{{f}}</div></sc-for>
      </div>
      <div style="display:flex;gap:6px"><button class="g-btn danger" type="button" style="flex:1">F: 비우기</button><button class="g-btn danger" type="button">삭제</button></div>
    </div>
    <div class="g-panel" style="padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="g-h">작업 기록</h2><span style="font-size:12px;color:#93a1b8">최근 100줄</span></div>
      <sc-for list="{{log}}" as="l" hint-placeholder-count="5"><div style="display:flex;gap:10px;font-size:12.5px;line-height:1.5"><span class="g-mono" style="color:#6f7f98">{{l.t}}</span><span style="color:{{l.c}}">{{l.m}}</span></div></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#22c55e', '#052410'], ALARM: ['#ef4444', '#ffffff'], WAIT: ['#facc15', '#2a2200'], OFF: ['#263247', '#b8c3d4'] };
    const label = { RUN: '가공', ALARM: '알람', WAIT: '대기', OFF: '정지' };
    const raw = [[1,'RUN','6001'],[3,'RUN','1452'],[5,'ALARM','1462'],[7,'WAIT','6002'],[9,'OFF','—'],[2,'RUN','6001'],[4,'RUN','6003'],[6,'OFF','—'],[8,'RUN','1452']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#dfe7f3' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#dfe7f3' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#86e3a8' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#ffd76a' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#dfe7f3' }
      ],
      machines: raw.map(([n, s, p]) => ({ n: n, state: label[s], prog: p, bg: colors[s][0], fg: colors[s][1] }))
    };
  }
}
</script>
</body>
</html>
