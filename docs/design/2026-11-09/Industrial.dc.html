<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>D 인더스트리얼 라이트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.d-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:4px;border:1.5px solid #2b2a27;background:#ffffff;color:#1c1b19;font:700 13px 'Noto Sans KR',sans-serif;box-sizing:border-box;cursor:pointer}
.d-btn.primary{background:#e8590c;border-color:#c2410c;color:#ffffff}
.d-btn.ghost{border-color:#cfcac0;font-weight:500}
.d-btn.danger{border-color:#b42318;color:#b42318}
.d-card{background:#ffffff;border:1px solid #d9d4ca;border-radius:4px;box-sizing:border-box}
.d-cap{font:700 11px 'Noto Sans KR',sans-serif;color:#6b665c;letter-spacing:.06em}
.d-h{font:800 15px 'Noto Sans KR',sans-serif;color:#1c1b19;margin:0}
.d-input{height:34px;border-radius:4px;border:1.5px solid #cfcac0;background:#ffffff;color:#1c1b19;padding:0 10px;font:700 14px 'JetBrains Mono',monospace;box-sizing:border-box}
.d-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;padding:16px 20px;background:#f2efe9;font-family:'Noto Sans KR',sans-serif;color:#1c1b19;display:flex;flex-direction:column;gap:12px">

  <div style="display:flex;align-items:center;gap:14px;height:44px;border-bottom:2px solid #1c1b19;padding-bottom:8px">
    <div style="font:800 22px 'Noto Sans KR',sans-serif;letter-spacing:-.02em">지후니우스</div>
    <span class="d-cap" style="padding:3px 6px;background:#1c1b19;color:#f2efe9">NC · STL · 세척</span>
    <div style="flex:1"></div>
    <sc-for list="{{popups}}" as="p" hint-placeholder-count="4">
      <button class="d-btn ghost" type="button">{{p}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b665c" stroke-width="2.2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;gap:10px;height:36px">
    <div style="display:flex;border:1.5px solid #1c1b19;border-radius:4px;overflow:hidden">
      <button type="button" style="height:33px;padding:0 18px;border:0;background:#1c1b19;color:#ffffff;font:700 13px 'Noto Sans KR',sans-serif">지후니우스</button>
      <button type="button" style="height:33px;padding:0 18px;border:0;border-left:1.5px solid #1c1b19;background:#ffffff;color:#1c1b19;font:500 13px 'Noto Sans KR',sans-serif">STL 찾기</button>
      <button type="button" style="height:33px;padding:0 18px;border:0;border-left:1.5px solid #1c1b19;background:#ffffff;color:#1c1b19;font:500 13px 'Noto Sans KR',sans-serif">세척완료</button>
    </div>
    <div style="flex:1;display:flex;justify-content:center"><button class="d-btn" type="button" style="background:#ffd43b;border-color:#1c1b19">인수인계 2</button></div>
    <button class="d-btn" type="button" style="background:#fff3bf"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1c1b19" stroke-width="2.2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>오류 기록 2</button>
    <button class="d-btn ghost" type="button">업데이트</button>
    <div class="d-mono" style="height:34px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#1c1b19;color:#8ce99a;border-radius:4px;font-size:12px"><span style="width:8px;height:8px;background:#51cf66"></span>READY · 대기 중</div>
  </div>

  <div class="d-card" style="padding:14px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:14px">
      <span class="d-cap" style="width:70px">작업 모드</span>
      <div style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <button type="button" class="d-btn ghost" style="height:36px">파일만 가져오기</button>
        <button type="button" class="d-btn ghost" style="height:36px">리스트만 만들기</button>
        <button type="button" class="d-btn" style="height:36px;background:#fff4e6;border-color:#e8590c;color:#a63f08;box-shadow:inset 0 -3px 0 #e8590c">파일 + 리스트 만들기</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="d-cap" style="width:70px">리스트</span>
      <div style="display:flex;gap:6px"><button type="button" class="d-btn d-mono" style="height:32px;background:#1c1b19;color:#ffffff">O3999</button><button type="button" class="d-btn ghost d-mono" style="height:32px">O3998</button></div>
      <label class="d-cap" for="d-year" style="margin-left:14px">연도</label>
      <input id="d-year" class="d-input" value="2026" style="width:80px">
      <label class="d-cap" for="d-date">날짜 폴더</label>
      <input id="d-date" class="d-input" value="11.09" style="width:100px;border-color:#e8590c">
      <button class="d-btn ghost" type="button">경로설정</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:262px 262px minmax(0,1fr);gap:12px;height:336px">
    <div class="d-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 class="d-h">드라이브 정리</h2><span class="d-mono" style="font-size:12px;color:#2b8a3e;font-weight:700">F:\ OK</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="d-btn ghost" type="button">추가</button><button class="d-btn ghost" type="button">새로고침</button></div>
      <div style="flex:1;border:1.5px solid #e3ded4;border-radius:4px;overflow:hidden">
        <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
          <div class="d-mono" style="padding:7px 10px;font-size:12.5px;border-bottom:1px dashed #e3ded4">{{f}}</div>
        </sc-for>
      </div>
      <div style="display:flex;gap:8px"><button class="d-btn danger" type="button" style="flex:1">F: 드라이브 비우기</button><button class="d-btn danger" type="button">삭제</button></div>
    </div>

    <div class="d-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 class="d-h">프로그램 번호</h2><span class="d-mono" style="font-size:12px;color:#6b665c">4 EA</span></div>
      <div class="d-mono" style="flex:1;border:1.5px solid #cfcac0;border-radius:4px;padding:10px 12px;font-size:16px;font-weight:700;line-height:1.7;white-space:pre-line;background:repeating-linear-gradient(#ffffff 0 27px,#f4f1ec 27px 28px)">1452
1462
6001
6002</div>
      <button class="d-btn primary" type="button" style="height:42px;font-size:14px">파일 + 리스트 만들기</button>
    </div>

    <div class="d-card" style="padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:baseline;justify-content:space-between"><h2 class="d-h">작업 기록</h2><span class="d-cap">최근 100줄</span></div>
      <div style="flex:1;background:#1c1b19;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;overflow:hidden">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="6">
          <div class="d-mono" style="display:flex;gap:10px;font-size:12px;line-height:1.5"><span style="color:#8a857a;flex:none">{{l.t}}</span><span style="color:{{l.c}};font-family:'Noto Sans KR',sans-serif">{{l.m}}</span></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="d-card" style="padding:12px 16px;display:flex;align-items:center;gap:20px">
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;width:640px">
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
        <div style="height:46px;border-radius:4px;border:1.5px solid #1c1b19;background:{{m.bg}};color:{{m.fg}};display:flex;align-items:center;justify-content:space-between;padding:0 10px;box-sizing:border-box">
          <span style="font:800 13px 'Noto Sans KR',sans-serif">#{{m.n}}</span><span class="d-mono" style="font-size:15px;font-weight:700">{{m.prog}}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:12px">
      <span class="d-cap">머신 알림 · 9대</span>
      <div style="display:flex;border:1.5px solid #1c1b19;border-radius:4px;overflow:hidden"><span style="padding:6px 12px;background:#1c1b19;color:#ffffff;font:700 12px 'JetBrains Mono',monospace">ON</span><span style="padding:6px 12px;background:#ffffff;color:#8a857a;font:700 12px 'JetBrains Mono',monospace">OFF</span></div>
      <button class="d-btn ghost" type="button">알림 설정</button>
    </div>
  </div>

  <div class="d-card" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <h2 class="d-h">소재 사용량 조사</h2>
    <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px">
      <sc-for list="{{units}}" as="u" hint-placeholder-count="9">
        <div style="display:flex;flex-direction:column;gap:5px">
          <div class="d-mono" style="text-align:center;font-size:12px;font-weight:700;padding:3px 0;background:#e9e4da;border-radius:3px">{{u}}</div>
          <button class="d-btn ghost" type="button" style="height:32px;padding:0 4px;font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2.2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>불량</button>
          <button class="d-btn ghost" type="button" style="height:32px;padding:0 4px;font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1c1b19" stroke-width="2.2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>소재교체</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#69db7c', '#0b2e13'], ALARM: ['#ff6b6b', '#2b0505'], WAIT: ['#ffd43b', '#2b2100'], OFF: ['#e9e4da', '#6b665c'] };
    const raw = [[1,'RUN','6001'],[3,'RUN','1452'],[5,'ALARM','1462'],[7,'WAIT','6002'],[9,'OFF','—'],[2,'RUN','6001'],[4,'RUN','6003'],[6,'OFF','—'],[8,'RUN','1452']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량 Beta'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#f2efe9' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#f2efe9' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#8ce99a' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#ffd43b' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#f2efe9' }
      ],
      machines: raw.map(([n, s, p]) => ({ n: n, prog: p, bg: colors[s][0], fg: colors[s][1] })),
      units: ['1호기','2호기','3호기','4호기','5호기','6호기','7호기','8호기','9호기']
    };
  }
}
</script>
</body>
</html>
