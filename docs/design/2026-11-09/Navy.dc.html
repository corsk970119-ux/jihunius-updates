<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C 미드나잇 네이비</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.c-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 16px;border-radius:999px;border:1px solid #2f4468;background:#17253f;color:#dbe6f7;font:500 13px 'Noto Sans KR',sans-serif;box-sizing:border-box;cursor:pointer}
.c-btn.primary{background:#5b9bff;border-color:#5b9bff;color:#06152e;font-weight:700}
.c-btn.danger{background:#2a1420;border-color:#6d2c3c;color:#ffb3c0}
.c-panel{background:#111c31;border:1px solid #213252;border-radius:16px;box-sizing:border-box;overflow:hidden}
.c-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1d2c48}
.c-h{font:700 14px 'Noto Sans KR',sans-serif;color:#f1f5fc;margin:0}
.c-sub{font:500 12px 'Noto Sans KR',sans-serif;color:#90a3c2}
.c-input{height:34px;border-radius:10px;border:1px solid #2f4468;background:#0b1424;color:#f1f5fc;padding:0 12px;font:500 14px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.c-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;padding:16px 20px;background:#0a1222;font-family:'Noto Sans KR',sans-serif;color:#dbe6f7;display:flex;flex-direction:column;gap:12px">

  <div style="display:flex;align-items:center;gap:16px;height:44px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:34px;height:34px;border-radius:50%;background:#5b9bff;display:flex;align-items:center;justify-content:center;color:#06152e;font:800 15px 'Noto Sans KR',sans-serif">J</div>
      <div style="display:flex;flex-direction:column;line-height:1.1"><span style="font:700 19px 'Noto Sans KR',sans-serif;color:#ffffff">지후니우스</span><span class="c-sub">NC 검사·입고 매니저</span></div>
    </div>
    <div style="flex:1"></div>
    <sc-for list="{{popups}}" as="p" hint-placeholder-count="4">
      <button class="c-btn" type="button">{{p}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#90a3c2" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
    </sc-for>
  </div>

  <div style="display:flex;align-items:center;gap:12px;height:40px;padding:0 6px 0 4px;background:#0e182c;border:1px solid #1d2c48;border-radius:999px">
    <button type="button" style="height:32px;padding:0 18px;border:0;border-radius:999px;background:#5b9bff;color:#06152e;font:700 13px 'Noto Sans KR',sans-serif">지후니우스</button>
    <button type="button" style="height:32px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#a8b8d2;font:500 13px 'Noto Sans KR',sans-serif">STL 찾기</button>
    <button type="button" style="height:32px;padding:0 18px;border:0;border-radius:999px;background:transparent;color:#a8b8d2;font:500 13px 'Noto Sans KR',sans-serif">세척완료</button>
    <div style="flex:1;display:flex;justify-content:center"><button class="c-btn" type="button" style="height:30px;background:#3a2c08;border-color:#7a5b10;color:#ffd770">인수인계 · 2</button></div>
    <button class="c-btn" type="button" style="height:30px;background:#3a2c08;border-color:#7a5b10;color:#ffd770">오류 기록 2</button>
    <button class="c-btn" type="button" style="height:30px">업데이트</button>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:#7ee2a8;font:600 12px 'Noto Sans KR',sans-serif"><span style="width:8px;height:8px;border-radius:50%;background:#34d399"></span>대기 중</span>
  </div>

  <div class="c-panel" style="padding:14px 18px;display:flex;align-items:center;gap:18px">
    <div style="display:flex;flex-direction:column;gap:6px;flex:1">
      <span class="c-sub">작업 모드</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <button type="button" class="c-btn" style="border-radius:12px;height:38px">파일만 가져오기</button>
        <button type="button" class="c-btn" style="border-radius:12px;height:38px">리스트만 만들기</button>
        <button type="button" class="c-btn" style="border-radius:12px;height:38px;background:#1d3a6b;border-color:#5b9bff;color:#ffffff;font-weight:700">파일 + 리스트 만들기</button>
      </div>
    </div>
    <div style="width:1px;align-self:stretch;background:#1d2c48"></div>
    <div style="display:grid;grid-template-columns:auto auto;column-gap:10px;row-gap:8px;align-items:center">
      <span class="c-sub">리스트</span>
      <div style="display:flex;gap:6px"><button type="button" class="c-btn c-mono" style="height:30px;padding:0 12px;background:#5b9bff;border-color:#5b9bff;color:#06152e">O3999</button><button type="button" class="c-btn c-mono" style="height:30px;padding:0 12px">O3998</button></div>
      <label class="c-sub" for="c-year">연도 · 날짜</label>
      <div style="display:flex;gap:6px"><input id="c-year" class="c-input c-mono" value="2026" style="width:70px"><input class="c-input c-mono" aria-label="날짜 폴더" value="11.09" style="width:80px;border-color:#5b9bff"><button class="c-btn" type="button" style="height:34px;padding:0 12px">경로</button></div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:262px 262px minmax(0,1fr);gap:12px;height:330px">
    <div class="c-panel" style="display:flex;flex-direction:column">
      <div class="c-head"><h2 class="c-h">드라이브 정리</h2><span class="c-mono" style="font-size:12px;color:#7ee2a8">F:\ ●</span></div>
      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="c-btn" type="button">추가</button><button class="c-btn" type="button">새로고침</button></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden">
          <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
            <div class="c-mono" style="padding:6px 10px;border-radius:8px;background:#0d1729;font-size:12.5px;color:#cdd9ec">{{f}}</div>
          </sc-for>
        </div>
        <div style="display:flex;gap:8px"><button class="c-btn danger" type="button" style="flex:1">F: 드라이브 비우기</button><button class="c-btn danger" type="button">삭제</button></div>
      </div>
    </div>

    <div class="c-panel" style="display:flex;flex-direction:column">
      <div class="c-head"><h2 class="c-h">프로그램 번호</h2><span class="c-sub">4개</span></div>
      <div style="padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1">
        <div class="c-mono" style="flex:1;background:#0b1424;border:1px solid #213252;border-radius:12px;padding:10px 14px;font-size:15px;line-height:1.75;color:#ffffff;white-space:pre-line">1452
1462
6001
6002</div>
        <button class="c-btn primary" type="button" style="height:42px">파일 + 리스트 만들기</button>
      </div>
    </div>

    <div class="c-panel" style="display:flex;flex-direction:column">
      <div class="c-head"><h2 class="c-h">작업 기록</h2><span class="c-sub">최근 100줄</span></div>
      <div style="padding:12px 16px;display:flex;flex-direction:column;gap:8px;flex:1;overflow:hidden">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="6">
          <div style="display:flex;gap:12px;font-size:12.5px;line-height:1.5;align-items:baseline"><span style="width:6px;height:6px;border-radius:50%;background:{{l.c}};flex:none;transform:translateY(-1px)"></span><span class="c-mono" style="color:#7287a8;flex:none">{{l.t}}</span><span style="color:#dbe6f7">{{l.m}}</span></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="c-panel" style="padding:12px 16px;display:flex;align-items:center;gap:16px">
    <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;flex:1">
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
        <div style="height:62px;border-radius:12px;background:{{m.bg}};color:{{m.fg}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
          <span style="font:600 11px 'Noto Sans KR',sans-serif">{{m.name}}</span><span class="c-mono" style="font:700 17px 'JetBrains Mono',monospace">{{m.prog}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <div style="display:flex;align-items:center;gap:10px"><span style="font:700 13px 'Noto Sans KR',sans-serif;color:#f1f5fc">알림</span><div role="img" aria-label="알림 켜짐" style="width:44px;height:24px;border-radius:999px;background:#5b9bff;position:relative"><span style="position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#06152e"></span></div></div>
      <button class="c-btn" type="button" style="height:30px">알림 설정</button>
    </div>
  </div>

  <div class="c-panel" style="flex:1">
    <div style="display:grid;grid-template-columns:110px repeat(9,minmax(0,1fr));align-items:center">
      <div class="c-sub" style="padding:10px 16px;font-weight:700;color:#f1f5fc">소재 사용량</div>
      <sc-for list="{{units}}" as="u" hint-placeholder-count="9"><div style="text-align:center;padding:10px 0;font:600 12px 'Noto Sans KR',sans-serif;color:#90a3c2">{{u}}</div></sc-for>
      <div class="c-sub" style="padding:6px 16px;border-top:1px solid #1d2c48;display:flex;align-items:center;gap:6px;height:44px;box-sizing:border-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffd770" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>불량</div>
      <sc-for list="{{units}}" as="u" hint-placeholder-count="9"><div style="border-top:1px solid #1d2c48;height:44px;display:flex;align-items:center;justify-content:center"><button class="c-btn" type="button" aria-label="{{u}} 불량" style="height:30px;width:76px;padding:0">+ 불량</button></div></sc-for>
      <div class="c-sub" style="padding:6px 16px;border-top:1px solid #1d2c48;display:flex;align-items:center;gap:6px;height:44px;box-sizing:border-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8fbaff" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>소재교체</div>
      <sc-for list="{{units}}" as="u" hint-placeholder-count="9"><div style="border-top:1px solid #1d2c48;height:44px;display:flex;align-items:center;justify-content:center"><button class="c-btn" type="button" aria-label="{{u}} 소재교체" style="height:30px;width:76px;padding:0">교체</button></div></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#2fbf71', '#04210f'], ALARM: ['#f0505f', '#ffffff'], WAIT: ['#f6c945', '#2a2000'], OFF: ['#1b2944', '#a8b8d2'] };
    const raw = [[1,'RUN','6001'],[2,'RUN','6001'],[3,'RUN','1452'],[4,'RUN','6003'],[5,'ALARM','1462'],[6,'OFF','—'],[7,'WAIT','6002'],[8,'RUN','1452'],[9,'OFF','—']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량 Beta'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#5b9bff' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#5b9bff' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#34d399' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#ffd770' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#5b9bff' }
      ],
      machines: raw.map(([n, s, p]) => ({ name: '머신' + n, prog: p, bg: colors[s][0], fg: colors[s][1] })),
      units: ['1호기','2호기','3호기','4호기','5호기','6호기','7호기','8호기','9호기']
    };
  }
}
</script>
</body>
</html>
