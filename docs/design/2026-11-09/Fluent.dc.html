<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>B 라이트 플루언트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.b-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:6px;border:1px solid #cfd6e0;border-bottom-color:#b7c0cc;background:#ffffff;color:#1f2937;font:500 13px 'Noto Sans KR',sans-serif;box-sizing:border-box;cursor:pointer}
.b-btn.primary{background:#2563eb;border-color:#1d4ed8;color:#ffffff}
.b-btn.danger{color:#b42318;border-color:#f1b8b2;background:#fff5f4}
.b-card{background:#ffffff;border:1px solid #e3e7ee;border-radius:10px;box-sizing:border-box}
.b-label{font:500 13px 'Noto Sans KR',sans-serif;color:#4b5563}
.b-h{font:700 15px 'Noto Sans KR',sans-serif;color:#111827;margin:0}
.b-input{height:34px;border-radius:6px;border:1px solid #cfd6e0;background:#ffffff;color:#111827;padding:0 12px;font:500 14px 'Noto Sans KR',sans-serif;box-sizing:border-box}
.b-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
</style>
</helmet>
<div style="width:1120px;height:920px;box-sizing:border-box;padding:16px 20px;background:#f3f5f8;font-family:'Noto Sans KR',sans-serif;color:#1f2937;display:flex;flex-direction:column;gap:12px">

  <div style="display:flex;align-items:center;gap:14px;height:44px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="width:30px;height:30px;border-radius:8px;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#ffffff;font:700 14px 'Noto Sans KR',sans-serif">J</div>
      <div style="font:700 20px 'Noto Sans KR',sans-serif;color:#0b1220">지후니우스</div>
    </div>
    <div style="flex:1"></div>
    <div style="display:flex;gap:8px">
      <sc-for list="{{popups}}" as="p" hint-placeholder-count="4">
        <button class="b-btn" type="button">{{p}}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></button>
      </sc-for>
    </div>
  </div>

  <div style="display:flex;align-items:flex-end;gap:12px;height:40px;border-bottom:1px solid #dde2ea">
    <div style="display:flex;gap:24px;align-self:stretch">
      <button type="button" style="height:40px;padding:0 2px;border:0;border-bottom:3px solid #2563eb;background:transparent;color:#111827;font:700 14px 'Noto Sans KR',sans-serif">지후니우스</button>
      <button type="button" style="height:40px;padding:0 2px;border:0;border-bottom:3px solid transparent;background:transparent;color:#6b7280;font:500 14px 'Noto Sans KR',sans-serif">STL 찾기</button>
      <button type="button" style="height:40px;padding:0 2px;border:0;border-bottom:3px solid transparent;background:transparent;color:#6b7280;font:500 14px 'Noto Sans KR',sans-serif">세척완료</button>
    </div>
    <div style="flex:1;display:flex;justify-content:center;padding-bottom:5px">
      <button class="b-btn" type="button" style="background:#fff8e6;border-color:#f3cf72;color:#7a4b00">인수인계 2건</button>
    </div>
    <div style="display:flex;gap:8px;padding-bottom:5px;align-items:center">
      <button class="b-btn" type="button" style="color:#92400e;border-color:#f3cf72;background:#fffbeb">오류 기록 2</button>
      <button class="b-btn" type="button">업데이트</button>
      <span style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:#e7f6ec;color:#166534;font:600 12px 'Noto Sans KR',sans-serif"><span style="width:7px;height:7px;border-radius:50%;background:#16a34a"></span>대기 중</span>
    </div>
  </div>

  <div class="b-card" style="padding:14px 18px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;row-gap:12px;align-items:center">
    <span class="b-label">작업 모드</span>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <button type="button" style="height:36px;border:1px solid #cfd6e0;border-radius:6px;background:#ffffff;color:#374151;font:500 13px 'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:8px;padding:0 12px"><span style="width:14px;height:14px;border-radius:50%;border:2px solid #9ca3af;box-sizing:border-box"></span>파일만 가져오기</button>
      <button type="button" style="height:36px;border:1px solid #cfd6e0;border-radius:6px;background:#ffffff;color:#374151;font:500 13px 'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:8px;padding:0 12px"><span style="width:14px;height:14px;border-radius:50%;border:2px solid #9ca3af;box-sizing:border-box"></span>리스트만 만들기</button>
      <button type="button" style="height:36px;border:1px solid #2563eb;border-radius:6px;background:#eef4ff;color:#1e3a8a;font:600 13px 'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:8px;padding:0 12px"><span style="width:14px;height:14px;border-radius:50%;border:4px solid #2563eb;box-sizing:border-box"></span>파일 + 리스트 만들기</button>
    </div>
    <span class="b-label">리스트 파일</span>
    <div style="display:flex;align-items:center;gap:12px">
      <div style="display:flex;border:1px solid #cfd6e0;border-radius:6px;overflow:hidden">
        <button type="button" class="b-mono" style="height:32px;padding:0 14px;border:0;background:#2563eb;color:#ffffff;font-size:13px">O3999</button>
        <button type="button" class="b-mono" style="height:32px;padding:0 14px;border:0;border-left:1px solid #cfd6e0;background:#ffffff;color:#374151;font-size:13px">O3998</button>
      </div>
      <label class="b-label" for="b-year" style="margin-left:16px">연도</label>
      <input id="b-year" class="b-input b-mono" value="2026" style="width:84px">
      <label class="b-label" for="b-date">날짜 폴더</label>
      <input id="b-date" class="b-input b-mono" value="11.09" style="width:110px;border-color:#2563eb;box-shadow:0 0 0 3px #dbe7ff">
      <button class="b-btn" type="button">경로설정</button>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:262px 262px minmax(0,1fr);gap:12px;height:340px">
    <div class="b-card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="b-h">드라이브 정리</h2><span style="font:600 12px 'Noto Sans KR',sans-serif;color:#15803d">F:\ 연결됨</span></div>
      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button class="b-btn" type="button">추가</button><button class="b-btn" type="button">새로고침</button></div>
      <div style="flex:1;border:1px solid #e3e7ee;border-radius:6px;overflow:hidden;display:flex;flex-direction:column">
        <sc-for list="{{files}}" as="f" hint-placeholder-count="5">
          <div class="b-mono" style="padding:7px 10px;font-size:12.5px;color:#1f2937;border-bottom:1px solid #f0f2f6">{{f}}</div>
        </sc-for>
      </div>
      <div style="display:flex;gap:8px"><button class="b-btn danger" type="button" style="flex:1">F: 드라이브 비우기</button><button class="b-btn danger" type="button">삭제</button></div>
    </div>

    <div class="b-card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="b-h">프로그램 번호</h2><span style="font-size:12px;color:#6b7280">4개 입력</span></div>
      <div class="b-mono" style="flex:1;border:1px solid #cfd6e0;border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.75;color:#111827;white-space:pre-line">1452
1462
6001
6002</div>
      <button class="b-btn primary" type="button" style="height:40px;font-weight:600">파일 + 리스트 만들기</button>
    </div>

    <div class="b-card" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="b-h">작업 기록</h2><span style="font-size:12px;color:#6b7280">최근 100줄</span></div>
      <div style="flex:1;background:#f8fafc;border:1px solid #e3e7ee;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;overflow:hidden">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="6">
          <div style="display:flex;gap:10px;font-size:12.5px;line-height:1.5"><span class="b-mono" style="color:#6b7280;flex:none">{{l.t}}</span><span style="color:{{l.c}}">{{l.m}}</span></div>
        </sc-for>
      </div>
    </div>
  </div>

  <div class="b-card" style="padding:12px 16px;display:flex;align-items:center;gap:20px">
    <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:640px">
      <sc-for list="{{machines}}" as="m" hint-placeholder-count="9">
        <div style="height:44px;border-radius:8px;background:{{m.bg}};color:{{m.fg}};display:flex;flex-direction:column;justify-content:center;padding:0 12px;box-sizing:border-box">
          <span style="font:600 11px 'Noto Sans KR',sans-serif;opacity:.9">{{m.name}} · {{m.state}}</span><span class="b-mono" style="font-size:14px">{{m.prog}}</span>
        </div>
      </sc-for>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px">
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font:700 13px 'Noto Sans KR',sans-serif;color:#111827">머신 알림</span><span style="font-size:12px;color:#6b7280">9대 선택</span></div>
      <div role="img" aria-label="알림 켜짐" style="width:46px;height:24px;border-radius:999px;background:#2563eb;position:relative"><span style="position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#ffffff"></span></div>
      <button class="b-btn" type="button">알림 설정</button>
    </div>
  </div>

  <div class="b-card" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <h2 class="b-h">소재 사용량 조사</h2>
    <div style="display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px">
      <sc-for list="{{units}}" as="u" hint-placeholder-count="9">
        <div style="display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid #e3e7ee;border-radius:8px;background:#fafbfc">
          <div style="text-align:center;font:700 12px 'Noto Sans KR',sans-serif;color:#374151">{{u}}</div>
          <button class="b-btn" type="button" style="height:30px;padding:0 4px;font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4M12 17v.5"></path></svg>불량</button>
          <button class="b-btn" type="button" style="height:30px;padding:0 4px;font-size:12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"></path></svg>소재교체</button>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":920}}'>
class Component extends DCLogic {
  renderVals() {
    const colors = { RUN: ['#16a34a', '#ffffff'], ALARM: ['#dc2626', '#ffffff'], WAIT: ['#facc15', '#3b2f00'], OFF: ['#e5e7eb', '#374151'] };
    const label = { RUN: '가공', ALARM: '알람', WAIT: '대기', OFF: '정지' };
    const raw = [[1,'RUN','6001'],[3,'RUN','1452'],[5,'ALARM','1462'],[7,'WAIT','6002'],[9,'OFF','—'],[2,'RUN','6001'],[4,'RUN','6003'],[6,'OFF','—'],[8,'RUN','1452']];
    return {
      popups: ['세척일보', '돌출량', '특수 돌출량', '소재 사용량 조사 Beta'],
      files: ['O1452', 'O1462', 'O3999', 'O6001', '수정10.30.py'],
      log: [
        { t: '09:12', m: '파일 + 리스트 만들기 시작 · 11.09', c: '#1f2937' },
        { t: '09:12', m: '4개 가져옴 · 수정10.30 적용 4개', c: '#1f2937' },
        { t: '09:12', m: 'O3999 리스트 저장 완료', c: '#15803d' },
        { t: '09:30', m: 'O1462 → 제목과 파이가 다름 확인 필요', c: '#b45309' },
        { t: '10:05', m: '드라이브 새로고침 · 파일 5개', c: '#1f2937' }
      ],
      machines: raw.map(([n, s, p]) => ({ name: '머신' + n, state: label[s], prog: p, bg: colors[s][0], fg: colors[s][1] })),
      units: ['1호기','2호기','3호기','4호기','5호기','6호기','7호기','8호기','9호기']
    };
  }
}
</script>
</body>
</html>
